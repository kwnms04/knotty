language = "C"
header = "/* Generated from knotty-ffi by cbindgen. Do not edit by hand. */"
include_guard = "KNOTTY_H"
cpp_compat = true
style = "type"
documentation_style = "doxy"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
usize_is_size_t = true

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = true
include = ["knotty-core"]

[export]
# Attribute is a bit set for KtCell::attributes, so no signature refers to it.
include = ["Attribute"]

[export.rename]
Attribute = "KtAttribute"
Cell = "KtCell"
Rgb = "KtRgb"
Underline = "KtUnderline"
