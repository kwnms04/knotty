language = "C"
header = "/* Generated from knotty-ffi by cbindgen. Do not edit by hand. */"
include_guard = "KNOTTY_H"
cpp_compat = true
style = "type"
documentation_style = "doxy"
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
usize_is_size_t = true

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = true
include = ["knotty-core"]

[export]
# Bit sets: their fields are plain integers, so no signature refers to them.
include = ["Attribute", "RowFlag"]
# Compiled only for knotty's own tests. cbindgen reads through the cfg that
# gates it, so keep it out of the ABI by name.
exclude = ["kt_testing_panic"]

[export.rename]
Attribute = "KtAttribute"
Cell = "KtCell"
Cursor = "KtCursor"
CursorShape = "KtCursorShape"
Dirty = "KtDirty"
Rgb = "KtRgb"
Row = "KtRow"
RowFlag = "KtRowFlag"
SelectionRange = "KtSelectionRange"
Underline = "KtUnderline"
