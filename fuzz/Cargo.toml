[package]
name = "knotty-fuzz"
edition = "2024"
license = "MIT"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so `cargo test --workspace` at the root never builds this
# and the nightly toolchain libFuzzer needs stays out of the PR path.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
knotty-core = { path = "../crates/knotty-core" }

# The root manifest's stopgap, copied because a `[patch]` section only counts
# in the workspace it heads and this is a workspace of its own. Both copies go
# together: fuzzing the core without the soundness fixes fuzzes a different
# crate than CI builds. Cf. ADR 0012; both disappear with the facade.
[patch.crates-io]
libghostty-vt = { git = "https://github.com/kwnms04/libghostty-rs", branch = "knotty-stopgap" }
libghostty-vt-sys = { git = "https://github.com/kwnms04/libghostty-rs", branch = "knotty-stopgap" }

[[bin]]
name = "feed"
path = "fuzz_targets/feed.rs"
test = false
doc = false
bench = false
