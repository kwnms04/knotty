[package]
name = "knotty-fuzz"
edition = "2024"
license = "MIT"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so `cargo test --workspace` at the root never builds this
# and the nightly toolchain libFuzzer needs stays out of the PR path.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
knotty-core = { path = "../crates/knotty-core" }

# A copy of the root manifest's, because a `[patch]` section only counts in the
# workspace it heads and this is a workspace of its own. The two move together:
# fuzzing the core against a differently built engine fuzzes a different crate
# than CI builds. Both are permanent; cf. ADR 0012.
[patch.crates-io]
libghostty-vt-sys = { git = "https://github.com/kwnms04/libghostty-rs", branch = "knotty-stopgap" }

[[bin]]
name = "feed"
path = "fuzz_targets/feed.rs"
test = false
doc = false
bench = false
