name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The VT engine is built from ghostty sources by Zig. The pinned commit
  # rejects 0.16, so this version travels with the crate version.
  ZIG_VERSION: 0.15.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"

      - run: zig version

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the golden harness. It never writes a golden unless
      # KNOTTY_UPDATE_GOLDENS is set, which nothing here sets, so a screen that
      # changed fails the build rather than quietly becoming the new truth.
      - run: cargo test --workspace
