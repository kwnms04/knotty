name: CI

# Markdown is the whole of docs/ and no crate pulls it in with include_str!, so
# a markdown-only change cannot alter what fmt, clippy or the tests see.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

env:
  CARGO_TERM_COLOR: always
  # The VT engine is built from ghostty sources by Zig. The pinned commit
  # rejects 0.16, so this version travels with the crate version.
  ZIG_VERSION: 0.15.2

jobs:
  check:
    # macOS is the release platform. Linux is what enforces the portable-core
    # constraint of adr/0001, which appears nowhere in the code itself.
    strategy:
      # One platform breaking must not hide the other's result — telling them
      # apart is the whole reason for two runners.
      fail-fast: false
      matrix:
        include:
          # Pinned rather than macos-latest: Zig 0.15.2 cannot link against the
          # macOS 26 SDK, which is why AGENTS.md documents an xcrun shim for
          # local builds. Pinning keeps CI off that path.
          - runner: macos-15
            zig_target: aarch64-macos
          - runner: ubuntu-latest
            zig_target: x86_64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          set -euo pipefail
          zig_dir="zig-${{ matrix.zig_target }}-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${zig_dir}.tar.xz" \
            | tar -xJ
          echo "${PWD}/${zig_dir}" >> "${GITHUB_PATH}"

      - run: zig version

      # ghostty's own build pulls its dependencies — imgui, zigimg, vaxis — as
      # tarballs from GitHub, and without this every run demanded those
      # endpoints be healthy. On 2026-08-17 they were not: three of six job
      # attempts inside an hour died on 429, 502 and 503, none of them anything
      # to do with the change under test. A gate that fails at random is one
      # somebody turns off, which is the same reason `07-definition-of-done.md`
      # keeps the benches off CI.
      #
      # Keyed on the lockfile because the pin that decides which dependencies
      # exist — `GHOSTTY_COMMIT`, in the patched `-sys` build script — is not a
      # file in this repo. It is a proxy, so an unrelated dependency bump costs
      # one cold fetch; the restore key is what keeps that from being a full
      # one, since Zig fetches only the packages it did not find.
      #
      # This shrinks the exposure rather than removing it: the ghostty clone
      # itself still happens every run.
      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-pkg-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-pkg-${{ matrix.runner }}-

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the golden harness. It never writes a golden unless
      # KNOTTY_UPDATE_GOLDENS is set, which nothing here sets, so a screen that
      # changed fails the build rather than quietly becoming the new truth.
      - run: cargo test --workspace
