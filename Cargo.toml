[workspace]
members = [
    "crates/knotty-config",
    "crates/knotty-core",
    "crates/knotty-ffi",
    "crates/knotty-harness",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.0.0"

[workspace.dependencies]
knotty-config = { path = "crates/knotty-config" }
knotty-core = { path = "crates/knotty-core" }
# Pinned: the VT engine is a public alpha. Bumping it is gated on the harness.
# The bindgen-generated layer only: the safe boundary above it is knotty's own,
# in `knotty-core`'s `vt` module. cf. ADR 0012.
libghostty-vt-sys = "=0.2.1"
# The operating system calls the I/O thread makes. Already in the graph as a
# build-time dependency, so nothing new is pulled in for it; cf. the M1 spec,
# `kwnms04/knotty#10`.
rustix = { version = "1.1", features = ["event", "pipe", "process", "pty", "termios"] }
# The one call rustix does not wrap: `proc_pidinfo`, which is how the working
# directory of a process is read on a system with no `/proc`. Already in the
# graph under rustix, so nothing new is pulled in for it either.
libc = "0.2"

# Permanent, not a stopgap. The branch is one commit on top of 0.2.1 and it
# touches `build.rs` alone — the hooks `ZIG` and `ZIG_SYSROOT`, which AGENTS.md
# explains. This section staying is the steady state rather than a leftover to
# clear; the cost is re-cutting that one commit on each engine bump, which is
# what was traded for not depending on an upstream release. cf. ADR 0012.
[patch.crates-io]
libghostty-vt-sys = { git = "https://github.com/kwnms04/libghostty-rs", branch = "knotty-build-hooks" }
